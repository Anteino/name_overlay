<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <style>

    /* =========================================================
       FIXED PAGE
       ========================================================= */

    html,
    body {
      position: fixed;

      left: 0;
      top: 0;
      right: 0;
      bottom: 0;

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: transparent;

      overflow: hidden;
    }


    /* =========================================================
       1920 x 1080 INTERNAL CANVAS
       ========================================================= */

    #overlayStage {
      position: absolute;

      left: 0;
      top: 0;

      width: 1920px;
      height: 1080px;

      transform-origin: 0 0;

      overflow: hidden;
    }


    /* =========================================================
       SVG
       ========================================================= */

    #svg {
      position: absolute;

      left: 0;
      top: 0;

      width: 1920px;
      height: 1080px;

      display: block;

      margin: 0;
      padding: 0;
    }


    /* =========================================================
       CONTROLS
       ========================================================= */

    #controls {
      position: fixed;

      left: 0;
      top: 1100px;

      padding: 10px;

      font-family: sans-serif;

      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    #editor {
      width: 400px;
      font-size: 50px;
    }

    #submit {
      font-size: 50px;
      padding: 4px 10px;
      height: fit-content;
    }


    /* =========================================================
       DEBUG
       ========================================================= */

    #debug {
      display: none;

      position: fixed;

      left: 10px;
      top: 10px;

      padding: 10px;

      background: rgba(255, 255, 255, 0.9);
      color: black;

      font-family: monospace;
      font-size: 20px;

      z-index: 999999;
    }

  </style>

</head>


<body>


<!-- =========================================================
     1920 x 1080 OVERLAY
     ========================================================= -->

<div id="overlayStage">

  <svg
    id="svg"
    width="1920"
    height="1080"
    viewBox="0 0 1920 1080"
    preserveAspectRatio="none"
  >

    <defs>

      <!-- =====================================================
           BLACK CUTOUT MASK
           ===================================================== -->

      <mask
        id="cutoutMask"
        maskUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="1920"
        height="1080"
      >

        <rect
          x="0"
          y="0"
          width="1920"
          height="1080"
          fill="white"
        />

      </mask>

    </defs>

  </svg>

</div>


<!-- =========================================================
     EDITOR
     ========================================================= -->

<div id="controls">

  <textarea
    id="editor"
    rows="4"
  ></textarea>

  <button id="submit">
    Submit
  </button>

</div>


<!-- =========================================================
     DEBUG
     ========================================================= -->

<div id="debug"></div>


<script>


// =============================================================
// AUTOMATIC OBS / CHROMIUM SCALE COMPENSATION
// =============================================================

const DESIGN_WIDTH =
  1920;

const DESIGN_HEIGHT =
  1080;


const overlayStage =
  document.getElementById(
    "overlayStage"
  );


function updateStageScale() {

  /*
   * Actual CSS viewport provided by Chromium.
   */

  const viewportWidth =
    window.innerWidth;

  const viewportHeight =
    window.innerHeight;


  /*
   * Calculate scale needed to fit the complete
   * 1920 x 1080 design inside the viewport.
   */

  const scaleX =
    viewportWidth /
    DESIGN_WIDTH;

  const scaleY =
    viewportHeight /
    DESIGN_HEIGHT;


  const scale =
    Math.min(
      scaleX,
      scaleY
    );


  /*
   * Scale the COMPLETE overlay as one object.
   *
   * The SVG remains internally 1920 x 1080.
   */

  overlayStage.style.transform =
    `scale(${scale})`;


  /*
   * Always anchor at top-left.
   */

  overlayStage.style.left =
    "0px";

  overlayStage.style.top =
    "0px";


  /*
   * Update optional debug information.
   */

  const debug =
    document.getElementById(
      "debug"
    );


  debug.textContent =
    "Viewport: " +
    viewportWidth +
    " × " +
    viewportHeight +
    "\nDPR: " +
    window.devicePixelRatio +
    "\nScaleX: " +
    scaleX +
    "\nScaleY: " +
    scaleY +
    "\nFinal scale: " +
    scale;

}


// =============================================================
// INITIAL SCALE
// =============================================================

updateStageScale();


// =============================================================
// HANDLE RESIZE
// =============================================================

window.addEventListener(
  "resize",
  updateStageScale
);


if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    updateStageScale
  );

}


// =============================================================
// PARAMETERS
// =============================================================

let text =
  "Silly\nGoose";

let glowColor =
  null;


/*
 * =============================================================
 * TRANSPARENCY TRANSITION WIDTH
 * =============================================================
 */

const transitionWidth =
  20;


/*
 * Number of transparency bands.
 */

const numberOfBands =
  5;


const params =
  new URLSearchParams(
    window.location.search
  );


if (params.has("name")) {

  text =
    params.get("name");

}


if (params.has("color")) {

  glowColor =
    params.get("color");

}


text =
  text.toUpperCase();


// =============================================================
// SVG
// =============================================================

const NS =
  "http://www.w3.org/2000/svg";


const svg =
  document.getElementById(
    "svg"
  );


const defs =
  svg.querySelector(
    "defs"
  );


const mask =
  document.getElementById(
    "cutoutMask"
  );


const targetW =
  1920;


const targetH =
  1080;


// =============================================================
// CREATE TEXT
// =============================================================

function createText(line) {

  const txt =
    document.createElementNS(
      NS,
      "text"
    );


  txt.textContent =
    line;


  txt.setAttribute(
    "font-size",
    "160"
  );


  txt.setAttribute(
    "font-family",
    "Impact, Arial Black, Arial, sans-serif"
  );


  txt.setAttribute(
    "font-weight",
    "900"
  );


  txt.setAttribute(
    "x",
    "0"
  );


  txt.setAttribute(
    "y",
    "0"
  );


  return txt;

}


// =============================================================
// CALCULATE TEXT POSITION / SCALE
// =============================================================

function calculateLine(
  line,
  index,
  lines
) {

  const boxH =
    targetH /
    lines.length;


  const measurement =
    createText(
      line
    );


  svg.appendChild(
    measurement
  );


  const bbox =
    measurement.getBBox();


  const shrinkFactor =
    0.3;


  const newHeight =
    bbox.height *
    (1 - shrinkFactor);


  const deltaY =
    (
      bbox.height -
      newHeight
    ) / 2;


  const objX =
    bbox.x;


  const objY =
    bbox.y +
    deltaY;


  const objW =
    bbox.width;


  const objH =
    newHeight;


  const scaleX =
    targetW /
    objW;


  const scaleY =
    boxH /
    objH;


  const offsetY =
    index *
    boxH;


  const transform =
    `translate(0,${offsetY}) ` +
    `scale(${scaleX},${scaleY}) ` +
    `translate(${-objX},${-objY})`;


  svg.removeChild(
    measurement
  );


  return {
    line,
    transform,
    scaleX,
    scaleY
  };

}


// =============================================================
// CREATE INNER GLOW FILTER
// =============================================================

function createInnerGlowFilter(
  id,
  scaleX,
  scaleY
) {

  const filter =
    document.createElementNS(
      NS,
      "filter"
    );


  filter.setAttribute(
    "id",
    id
  );


  filter.setAttribute(
    "x",
    "-10%"
  );


  filter.setAttribute(
    "y",
    "-10%"
  );


  filter.setAttribute(
    "width",
    "120%"
  );


  filter.setAttribute(
    "height",
    "120%"
  );


  // ===========================================================
  // CALCULATE FINAL PIXEL WIDTH
  // ===========================================================

  const finalBandWidth =
    transitionWidth /
    numberOfBands;


  const sourceBandWidth =
    finalBandWidth /
    Math.min(
      scaleX,
      scaleY
    );


  // ===========================================================
  // CREATE PROGRESSIVELY ERODED SHAPES
  // ===========================================================

  const erosion =
    [];


  erosion[0] =
    "SourceAlpha";


  for (
    let i = 1;
    i <= numberOfBands;
    i++
  ) {

    const morphology =
      document.createElementNS(
        NS,
        "feMorphology"
      );


    morphology.setAttribute(
      "in",
      erosion[i - 1]
    );


    morphology.setAttribute(
      "operator",
      "erode"
    );


    morphology.setAttribute(
      "radius",
      sourceBandWidth
    );


    morphology.setAttribute(
      "result",
      `erosion_${i}`
    );


    filter.appendChild(
      morphology
    );


    erosion[i] =
      `erosion_${i}`;

  }


  // ===========================================================
  // OPACITY VALUES
  // ===========================================================

  const opacities =
    [];


  for (
    let i = 0;
    i < numberOfBands;
    i++
  ) {

    opacities.push(
      1 -
      (i / numberOfBands)
    );

  }


  // ===========================================================
  // MERGE ALL BANDS
  // ===========================================================

  const merge =
    document.createElementNS(
      NS,
      "feMerge"
    );


  // ===========================================================
  // CREATE EACH BAND
  // ===========================================================

  for (
    let i = 0;
    i < numberOfBands;
    i++
  ) {

    const band =
      document.createElementNS(
        NS,
        "feComposite"
      );


    band.setAttribute(
      "in",
      erosion[i]
    );


    band.setAttribute(
      "in2",
      erosion[i + 1]
    );


    band.setAttribute(
      "operator",
      "out"
    );


    band.setAttribute(
      "result",
      `band_${i}`
    );


    filter.appendChild(
      band
    );


    // ---------------------------------------------------------
    // COLORIZE BAND
    // ---------------------------------------------------------

    const flood =
      document.createElementNS(
        NS,
        "feFlood"
      );


    flood.setAttribute(
      "flood-color",
      glowColor
    );


    flood.setAttribute(
      "flood-opacity",
      opacities[i]
    );


    flood.setAttribute(
      "result",
      `color_${i}`
    );


    filter.appendChild(
      flood
    );


    const colorize =
      document.createElementNS(
        NS,
        "feComposite"
      );


    colorize.setAttribute(
      "in",
      `color_${i}`
    );


    colorize.setAttribute(
      "in2",
      `band_${i}`
    );


    colorize.setAttribute(
      "operator",
      "in"
    );


    colorize.setAttribute(
      "result",
      `coloredBand_${i}`
    );


    filter.appendChild(
      colorize
    );


    // ---------------------------------------------------------
    // ADD TO MERGE
    // ---------------------------------------------------------

    const node =
      document.createElementNS(
        NS,
        "feMergeNode"
      );


    node.setAttribute(
      "in",
      `coloredBand_${i}`
    );


    merge.appendChild(
      node
    );

  }


  // ===========================================================
  // FINAL OUTPUT
  // ===========================================================

  filter.appendChild(
    merge
  );


  defs.appendChild(
    filter
  );


  return filter;

}


// =============================================================
// CREATE INNER GLOW TEXT
// =============================================================

function createInnerGlow(
  item,
  index
) {

  const filterId =
    `innerGlow_${index}_${Date.now()}`;


  createInnerGlowFilter(
    filterId,
    item.scaleX,
    item.scaleY
  );


  const glowText =
    createText(
      item.line
    );


  glowText.setAttribute(
    "fill",
    "white"
  );


  glowText.setAttribute(
    "filter",
    `url(#${filterId})`
  );


  glowText.setAttribute(
    "transform",
    item.transform
  );


  svg.appendChild(
    glowText
  );

}


// =============================================================
// RENDER
// =============================================================

function render() {


  // -----------------------------------------------------------
  // Clear SVG except <defs>
  // -----------------------------------------------------------

  while (
    svg.children.length > 1
  ) {

    svg.removeChild(
      svg.lastChild
    );

  }


  // -----------------------------------------------------------
  // Clear mask except background rectangle
  // -----------------------------------------------------------

  while (
    mask.children.length > 1
  ) {

    mask.removeChild(
      mask.lastChild
    );

  }


  // -----------------------------------------------------------
  // Remove previous filters
  // -----------------------------------------------------------

  defs
    .querySelectorAll(
      "filter"
    )
    .forEach(
      filter =>
        filter.remove()
    );


  const lines =
    text.split(
      "\n"
    );


  // -----------------------------------------------------------
  // Calculate all text geometry
  // -----------------------------------------------------------

  const measurements =
    [];


  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    measurements.push(
      calculateLine(
        lines[i],
        i,
        lines
      )
    );

  }


  // ===========================================================
  // CREATE TRANSPARENCY BANDS
  // ===========================================================

  if (glowColor) {

    measurements.forEach(
      (
        item,
        index
      ) => {

        createInnerGlow(
          item,
          index
        );

      }
    );

  }


  // ===========================================================
  // CUTOUT MASK
  // ===========================================================

  measurements.forEach(
    item => {

      const group =
        document.createElementNS(
          NS,
          "g"
        );


      group.setAttribute(
        "transform",
        item.transform
      );


      const hole =
        createText(
          item.line
        );


      hole.setAttribute(
        "fill",
        "black"
      );


      group.appendChild(
        hole
      );


      mask.appendChild(
        group
      );

    }
  );


  // ===========================================================
  // BLACK OVERLAY
  // ===========================================================

  const overlay =
    document.createElementNS(
      NS,
      "rect"
    );


  overlay.setAttribute(
    "x",
    "0"
  );


  overlay.setAttribute(
    "y",
    "0"
  );


  overlay.setAttribute(
    "width",
    "1920"
  );


  overlay.setAttribute(
    "height",
    "1080"
  );


  overlay.setAttribute(
    "fill",
    "black"
  );


  overlay.setAttribute(
    "mask",
    "url(#cutoutMask)"
  );


  svg.appendChild(
    overlay
  );

}


// =============================================================
// INITIAL RENDER
// =============================================================

render();


// =============================================================
// SUBMIT
// =============================================================

document
  .getElementById(
    "submit"
  )
  .addEventListener(
    "click",
    () => {

      text =
        document
          .getElementById(
            "editor"
          )
          .value
          .toUpperCase();


      render();

    }
  );


</script>

</body>

</html>
