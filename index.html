<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    /* =========================================================
       FIXED 1920 x 1080 NAME STAGE
       ========================================================= */

    #overlayStage {
      position: relative;

      width: 1920px;
      height: 1080px;

      min-width: 1920px;
      min-height: 1080px;

      max-width: 1920px;
      max-height: 1080px;

      overflow: hidden;
    }

    #svg {
      position: absolute;

      left: 0;
      top: 0;

      width: 1920px !important;
      height: 1080px !important;

      min-width: 1920px;
      min-height: 1080px;

      max-width: 1920px;
      max-height: 1080px;

      display: block;
      margin: 0;
      padding: 0;
    }

    /* =========================================================
       CONTROLS
       ========================================================= */

    #controls {
      padding: 20px;
      font-family: sans-serif;

      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    #editor {
      width: 800px;
      font-size: 200px;
    }

    #submit {
      font-size: 200px;
      padding: 8px 20px;
      height: fit-content;
    }
  </style>
</head>

<body>

<!-- ===========================================================
     1920 x 1080 OVERLAY
     =========================================================== -->

<div id="overlayStage">

  <svg
    id="svg"
    width="1920"
    height="1080"
    viewBox="0 0 1920 1080"
    preserveAspectRatio="none"
  >

    <defs>

      <!-- =====================================================
           BLACK CUTOUT MASK
           ===================================================== -->

      <mask
        id="cutoutMask"
        maskUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="1920"
        height="1080"
      >

        <rect
          x="0"
          y="0"
          width="1920"
          height="1080"
          fill="white"
        />

      </mask>

    </defs>

  </svg>

</div>


<!-- ===========================================================
     EDITOR
     =========================================================== -->

<div id="controls">

  <textarea
    id="editor"
    rows="4"
  ></textarea>

  <button id="submit">
    Submit
  </button>

</div>


<script>

// =============================================================
// PARAMETERS
// =============================================================

let text = "Silly\nGoose";
let glowColor = null;

/*
 * =============================================================
 * TRANSPARENCY TRANSITION WIDTH
 * =============================================================
 *
 * This is the TOTAL width of the transparency transition
 * in the FINAL 1920 x 1080 image.
 *
 * Examples:
 *
 *   5  = 5px total
 *   10 = 10px total
 *   20 = 20px total
 *   30 = 30px total
 *
 * There are always 10 bands.
 *
 * Therefore:
 *
 *   10px / 10 bands = approximately 1px per band
 *
 * Set this to whatever transition width you want.
 */

const transitionWidth = 20;


/*
 * Number of transparency bands.
 *
 * Keep this at 10 if you want:
 *
 * 100%, 90%, 80%, ... 10%
 */
const numberOfBands = 5;


const params =
  new URLSearchParams(window.location.search);

if (params.has("name")) {
  text = params.get("name");
}

if (params.has("color")) {
  glowColor = params.get("color");
}

text = text.toUpperCase();


// =============================================================
// SVG
// =============================================================

const NS =
  "http://www.w3.org/2000/svg";

const svg =
  document.getElementById("svg");

const defs =
  svg.querySelector("defs");

const mask =
  document.getElementById("cutoutMask");

const targetW = 1920;
const targetH = 1080;


// =============================================================
// CREATE TEXT
// =============================================================

function createText(line) {

  const txt =
    document.createElementNS(
      NS,
      "text"
    );

  txt.textContent = line;

  txt.setAttribute(
    "font-size",
    "160"
  );

  txt.setAttribute(
    "font-family",
    "Impact, Arial Black, Arial, sans-serif"
  );

  txt.setAttribute(
    "font-weight",
    "900"
  );

  txt.setAttribute(
    "x",
    "0"
  );

  txt.setAttribute(
    "y",
    "0"
  );

  return txt;
}


// =============================================================
// CALCULATE TEXT POSITION / SCALE
// =============================================================

function calculateLine(
  line,
  index,
  lines
) {

  const boxH =
    targetH / lines.length;

  const measurement =
    createText(line);

  svg.appendChild(
    measurement
  );

  const bbox =
    measurement.getBBox();


  /*
   * Same vertical sizing behavior as the original.
   */

  const shrinkFactor =
    0.3;

  const newHeight =
    bbox.height *
    (1 - shrinkFactor);

  const deltaY =
    (bbox.height - newHeight) / 2;


  const objX =
    bbox.x;

  const objY =
    bbox.y + deltaY;

  const objW =
    bbox.width;

  const objH =
    newHeight;


  const scaleX =
    targetW / objW;

  const scaleY =
    boxH / objH;

  const offsetY =
    index * boxH;


  const transform =
    `translate(0,${offsetY}) ` +
    `scale(${scaleX},${scaleY}) ` +
    `translate(${-objX},${-objY})`;


  svg.removeChild(
    measurement
  );


  return {
    line,
    transform,

    /*
     * Save these because the inner bands need to compensate
     * for the scaling later.
     */
    scaleX,
    scaleY
  };
}


// =============================================================
// CREATE THE 10 NESTED COLOR BANDS
// =============================================================
//
// Each band is:
//
//   previous shape - next eroded shape
//
// Therefore every band:
//
//   • touches the next band
//   • cannot overlap the next band
//   • cannot leave a gap
//
// The erosion amount is calculated so that the resulting
// distance in the FINAL 1920 x 1080 image is controlled by
// transitionWidth.
// =============================================================

function createInnerGlowFilter(
  id,
  scaleX,
  scaleY
) {

  const filter =
    document.createElementNS(
      NS,
      "filter"
    );

  filter.setAttribute(
    "id",
    id
  );

  filter.setAttribute(
    "x",
    "-10%"
  );

  filter.setAttribute(
    "y",
    "-10%"
  );

  filter.setAttribute(
    "width",
    "120%"
  );

  filter.setAttribute(
    "height",
    "120%"
  );


  // ===========================================================
  // CALCULATE FINAL PIXEL WIDTH
  // ===========================================================

  /*
   * We want the whole transition to be transitionWidth pixels
   * wide in the FINAL image.
   *
   * Each band therefore represents:
   *
   *     transitionWidth / numberOfBands
   *
   * final pixels.
   */

  const finalBandWidth =
    transitionWidth / numberOfBands;


  /*
   * feMorphology works BEFORE the text's scale transform.
   *
   * Therefore we need to convert final pixels back into the
   * original SVG coordinate system.
   *
   * Because scaleX and scaleY can be different, we create
   * separate horizontal and vertical compensation.
   *
   * SVG feMorphology uses a radius in the filter's coordinate
   * system. Using the smaller scale factor prevents the band
   * from becoming wider than requested in either direction.
   */

  const sourceBandWidth =
    finalBandWidth /
    Math.min(
      scaleX,
      scaleY
    );


  // ===========================================================
  // CREATE PROGRESSIVELY ERODED SHAPES
  // ===========================================================

  const erosion = [];

  /*
   * Original text.
   */
  erosion[0] =
    "SourceAlpha";


  /*
   * Create each successive erosion.
   *
   * Each step moves exactly one band farther inward.
   */

  for (
    let i = 1;
    i <= numberOfBands;
    i++
  ) {

    const morphology =
      document.createElementNS(
        NS,
        "feMorphology"
      );

    morphology.setAttribute(
      "in",
      erosion[i - 1]
    );

    morphology.setAttribute(
      "operator",
      "erode"
    );

    /*
     * Every step is exactly one band width.
     */
    morphology.setAttribute(
      "radius",
      sourceBandWidth
    );

    morphology.setAttribute(
      "result",
      `erosion_${i}`
    );

    filter.appendChild(
      morphology
    );

    erosion[i] =
      `erosion_${i}`;
  }


  // ===========================================================
  // OPACITY VALUES
  // ===========================================================

  const opacities = [];

  for (
    let i = 0;
    i < numberOfBands;
    i++
  ) {

    /*
     * 1.0, 0.9, 0.8 ... 0.1
     */
    opacities.push(
      1 -
      (i / numberOfBands)
    );

  }


  // ===========================================================
  // MERGE ALL BANDS
  // ===========================================================

  const merge =
    document.createElementNS(
      NS,
      "feMerge"
    );


  // ===========================================================
  // CREATE EACH BAND
  // ===========================================================

  for (
    let i = 0;
    i < numberOfBands;
    i++
  ) {

    /*
     * IMPORTANT:
     *
     * Band 0:
     *
     *   Original
     *      MINUS
     *   Erosion 1
     *
     * Band 1:
     *
     *   Erosion 1
     *      MINUS
     *   Erosion 2
     *
     * etc.
     *
     * This guarantees the bands are adjacent.
     */

    const band =
      document.createElementNS(
        NS,
        "feComposite"
      );

    band.setAttribute(
      "in",
      erosion[i]
    );

    band.setAttribute(
      "in2",
      erosion[i + 1]
    );

    band.setAttribute(
      "operator",
      "out"
    );

    band.setAttribute(
      "result",
      `band_${i}`
    );

    filter.appendChild(
      band
    );


    // ---------------------------------------------------------
    // COLORIZE BAND
    // ---------------------------------------------------------

    const flood =
      document.createElementNS(
        NS,
        "feFlood"
      );

    flood.setAttribute(
      "flood-color",
      glowColor
    );

    flood.setAttribute(
      "flood-opacity",
      opacities[i]
    );

    flood.setAttribute(
      "result",
      `color_${i}`
    );

    filter.appendChild(
      flood
    );


    const colorize =
      document.createElementNS(
        NS,
        "feComposite"
      );

    colorize.setAttribute(
      "in",
      `color_${i}`
    );

    colorize.setAttribute(
      "in2",
      `band_${i}`
    );

    colorize.setAttribute(
      "operator",
      "in"
    );

    colorize.setAttribute(
      "result",
      `coloredBand_${i}`
    );

    filter.appendChild(
      colorize
    );


    // ---------------------------------------------------------
    // ADD TO MERGE
    // ---------------------------------------------------------

    const node =
      document.createElementNS(
        NS,
        "feMergeNode"
      );

    node.setAttribute(
      "in",
      `coloredBand_${i}`
    );

    merge.appendChild(
      node
    );

  }


  // ===========================================================
  // FINAL OUTPUT
  // ===========================================================

  filter.appendChild(
    merge
  );

  defs.appendChild(
    filter
  );

  return filter;
}


// =============================================================
// CREATE INNER GLOW TEXT
// =============================================================

function createInnerGlow(
  item,
  index
) {

  const filterId =
    `innerGlow_${index}_${Date.now()}`;

  createInnerGlowFilter(
    filterId,
    item.scaleX,
    item.scaleY
  );


  const glowText =
    createText(item.line);

  glowText.setAttribute(
    "fill",
    "white"
  );

  glowText.setAttribute(
    "filter",
    `url(#${filterId})`
  );

  glowText.setAttribute(
    "transform",
    item.transform
  );


  /*
   * Draw the transparency bands before the black overlay.
   */

  svg.appendChild(
    glowText
  );
}


// =============================================================
// RENDER
// =============================================================

function render() {

  // -----------------------------------------------------------
  // Clear SVG except <defs>
  // -----------------------------------------------------------

  while (svg.children.length > 1) {

    svg.removeChild(
      svg.lastChild
    );

  }


  // -----------------------------------------------------------
  // Clear mask except background rectangle
  // -----------------------------------------------------------

  while (mask.children.length > 1) {

    mask.removeChild(
      mask.lastChild
    );

  }


  // -----------------------------------------------------------
  // Remove previous filters
  // -----------------------------------------------------------

  defs
    .querySelectorAll(
      "filter"
    )
    .forEach(
      filter => filter.remove()
    );


  const lines =
    text.split("\n");


  // -----------------------------------------------------------
  // Calculate all text geometry first.
  // -----------------------------------------------------------

  const measurements = [];

  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    measurements.push(
      calculateLine(
        lines[i],
        i,
        lines
      )
    );

  }


  // ===========================================================
  // CREATE TRANSPARENCY BANDS
  // ===========================================================

  if (glowColor) {
  measurements.forEach(
    (item, index) => {

      createInnerGlow(
        item,
        index
      );

    }
  );
}


  // ===========================================================
  // CUTOUT MASK
  // ===========================================================

  measurements.forEach(
    item => {

      const group =
        document.createElementNS(
          NS,
          "g"
        );

      group.setAttribute(
        "transform",
        item.transform
      );


      const hole =
        createText(item.line);

      hole.setAttribute(
        "fill",
        "black"
      );


      group.appendChild(
        hole
      );

      mask.appendChild(
        group
      );

    }
  );


  // ===========================================================
  // BLACK OVERLAY
  // ===========================================================

  const overlay =
    document.createElementNS(
      NS,
      "rect"
    );

  overlay.setAttribute(
    "x",
    "0"
  );

  overlay.setAttribute(
    "y",
    "0"
  );

  overlay.setAttribute(
    "width",
    "1920"
  );

  overlay.setAttribute(
    "height",
    "1080"
  );

  overlay.setAttribute(
    "fill",
    "black"
  );

  overlay.setAttribute(
    "mask",
    "url(#cutoutMask)"
  );


  svg.appendChild(
    overlay
  );
}


// =============================================================
// INITIAL RENDER
// =============================================================

render();


// =============================================================
// SUBMIT
// =============================================================

document
  .getElementById("submit")
  .addEventListener(
    "click",
    () => {

      text =
        document
          .getElementById("editor")
          .value
          .toUpperCase();

      render();

    }
  );

</script>

</body>
</html>
